name: Release NuGet package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable vMAJOR.MINOR.PATCH tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nuget-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Validate stable tag and pack once
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Stable tag required"; exit 1; }
          version="${RELEASE_TAG#v}"
          dotnet test SmartContract.sln --configuration Release
          dotnet pack src/Tricksfor.Blockchain.Booster/Tricksfor.Blockchain.Booster.csproj --configuration Release --no-build --output artifacts/nuget /p:PackageVersion="$version"
      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-${{ env.RELEASE_TAG }}
          path: artifacts/nuget/*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" artifacts/nuget/* --clobber
