name: Execute reviewed mainnet mint plan

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        type: choice
        required: true
        options: [ethereum-mainnet, polygon-mainnet, optimism-mainnet, bsc-mainnet, avalanche-mainnet]
      release_tag:
        description: Release containing the permanent deployment manifests
        required: true
        type: string
      mint_plan_path:
        description: Reviewed, committed token-to-recipient JSON plan
        required: true
        type: string
      dry_run:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mint-${{ inputs.deploy_env }}
  cancel-in-progress: false

jobs:
  mint:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_env }}
    env:
      DEPLOY_ENV: ${{ inputs.deploy_env }}
      Deployment__RpcUrl: ${{ secrets.RPC_URL }}
      Deployment__PrivateKey: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      Deployment__AdminAddress: ${{ vars.ADMIN_ADDRESS }}
      Deployment__MinterAddress: ${{ vars.MINTER_ADDRESS }}
      Deployment__StakingOwnerAddress: ${{ vars.STAKING_OWNER_ADDRESS }}
      Deployment__MintPlanPath: ${{ inputs.mint_plan_path }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Validate plan is committed and download deployment records
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MINT_PLAN_PATH: ${{ inputs.mint_plan_path }}
        shell: bash
        run: |
          test -f "$MINT_PLAN_PATH" || { echo "::error::Mint plan must be a committed file"; exit 1; }
          mkdir -p "deployments/$DEPLOY_ENV"
          gh release download "$RELEASE_TAG" --pattern 'TricksforBooster*.json' --dir "deployments/$DEPLOY_ENV"
      - run: dotnet build SmartContract.sln --configuration Release
      - run: cp "deployments/config/$DEPLOY_ENV/deployment-params.json" "src/Tricksfor.Blockchain.Booster.Deploy/bin/Release/net8.0/appsettings.$DEPLOY_ENV.json"
      - name: Validate or execute mint plan
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          dry_run_arg=""
          if [[ "$DRY_RUN" == "true" ]]; then dry_run_arg="--dry-run"; fi
          dotnet src/Tricksfor.Blockchain.Booster.Deploy/bin/Release/net8.0/Tricksfor.Blockchain.Booster.Deploy.dll mint $dry_run_arg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mint-${{ inputs.deploy_env }}-${{ github.run_id }}
          path: deployments/${{ inputs.deploy_env }}/mint-results.json
